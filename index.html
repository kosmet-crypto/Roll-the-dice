<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roll The Dice">
<title>Roll The Dice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-0: #0b1120; --bg-1: #131c33;
    --card: #1a2440; --card-2: #212d4d;
    --stroke: #2f3d64;
    --text: #eef2ff; --text-dim: #9aa8cc;
    --accent: #f97316; --accent-2: #fb923c;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e2a4d 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px
             calc(env(safe-area-inset-bottom, 0px) + 40px);
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }

  header { text-align: center; }

  .dice-icon {
    width: 56px; height: 56px; margin: 0 auto 12px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: linear-gradient(180deg, #24325a, #131c33);
    border: 1px solid var(--stroke);
    box-shadow: 0 8px 22px rgba(0,0,0,.4);
    cursor: pointer;
  }

  .dice-icon svg {
    width: 30px; height: 30px;
    fill: var(--accent);
  }

  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.4px; }
  header p { color: var(--text-dim); font-size: .85rem; margin-top: 6px; }

  .panel {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--stroke); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }

  .panel-title {
    font-size: .78rem; text-transform: uppercase; letter-spacing: 1.4px;
    color: var(--text-dim); font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--stroke), transparent);
  }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block; font-size: .82rem; font-weight: 600;
    color: var(--text-dim); margin-bottom: 7px;
  }
  select, input[type="number"] {
    width: 100%; font-size: 1rem; font-family: inherit; color: var(--text);
    background: #0e1730; border: 1px solid var(--stroke);
    border-radius: 12px; padding: 13px 14px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  select {
    background-image:
      linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
      linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(50% + 1px), calc(100% - 14px) calc(50% + 1px);
    background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
    padding-right: 40px;
  }

  /* Checkbox styling */
  .checkbox-row {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    font-size: .92rem; font-weight: 600; color: var(--text);
  }
  .checkbox-row input {
    width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;
  }

  /* Dice board */
  .dice-board {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
    min-height: 140px; align-items: center; padding: 20px 0;
  }

  /* 3D Dice styling */
  .die {
    width: 70px; height: 70px; border-radius: 14px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    transition: transform 0.4s ease;
  }
  .die.shaking {
    animation: shake 0.4s ease-in-out infinite;
  }
  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-4px, 4px) rotate(-10deg); }
    40% { transform: translate(4px, -3px) rotate(10deg); }
    60% { transform: translate(-3px, -2px) rotate(-6deg); }
    80% { transform: translate(3px, 3px) rotate(6deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* Dice themes */
  .die.white { background: #f8fafc; border: 2px solid #cbd5e1; }
  .die.white .dot { background: #0f172a; }

  .die.black { background: #0f172a; border: 2px solid #334155; }
  .die.black .dot { background: #f8fafc; }

  .dot {
    width: 12px; height: 12px; border-radius: 50%; align-self: center; justify-self: center;
    opacity: 0;
  }
  .dot.show { opacity: 1; }

  /* Buttons */
  .btn-generate {
    width: 100%; border: none; border-radius: 14px; padding: 17px;
    font-family: inherit; font-size: 1.06rem; font-weight: 800;
    letter-spacing: .3px; color: #1a1206;
    background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
    box-shadow: 0 8px 22px rgba(249,115,22,.32); cursor: pointer;
    transition: transform .1s, box-shadow .15s;
  }
  .btn-generate:active { transform: scale(.975); }

  .btn-secondary {
    flex: 1; border: 1px solid var(--stroke); border-radius: 12px; padding: 12px;
    font-family: inherit; font-size: .9rem; font-weight: 700;
    color: var(--text); background: rgba(255,255,255,.04); cursor: pointer;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,8,18,.82);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
    background: linear-gradient(180deg, #1c2748 0%, #151d35 100%);
    border: 1px solid var(--stroke); border-bottom: none;
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.9,.3,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-head h2 { font-size: 1.05rem; font-weight: 800; }
  .modal-close {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--stroke);
    background: rgba(255,255,255,.05); color: var(--text-dim); font-size: 1.2rem; cursor: pointer; display: grid; place-items: center;
  }

  .weight-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .weight-item { background: #0e1730; border: 1px solid var(--stroke); border-radius: 12px; padding: 10px; }
  .weight-item label { font-size: .78rem; margin-bottom: 4px; }
  .weight-item input { padding: 8px; font-size: .95rem; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translate(-50%, 140%); background: #15803d; color: #fff;
    font-size: .84rem; font-weight: 600; padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5); transition: transform .3s; z-index: 300;
  }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="dice-icon" id="secretTrigger" title="Tap 5 times for secret menu">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
    </div>
    <h1>Roll The Dice</h1>
    <p>Bacite коцкице кликом или мућкањем телефона</p>
  </header>

  <!-- Options Panel -->
  <section class="panel">
    <div class="panel-title">Подешавања</div>
    <div class="field">
      <label for="diceCountSelect">Број коцкица</label>
      <select id="diceCountSelect">
        <option value="1">1 коцкица</option>
        <option value="2" selected>2 коцкице</option>
        <option value="3">3 коцкице</option>
        <option value="4">4 коцкице</option>
        <option value="5">5 коцкица</option>
        <option value="6">6 коцкица</option>
      </select>
    </div>
    <div class="field">
      <label for="diceThemeSelect">Изглед коцкица</label>
      <select id="diceThemeSelect">
        <option value="white">Беле са црним тачкама</option>
        <option value="black">Црне са белим тачкама</option>
      </select>
    </div>
    <div class="field">
      <label class="checkbox-row">
        <input type="checkbox" id="soundToggle" checked> Звук мућкања
      </label>
    </div>
  </section>

  <!-- Dice Area -->
  <section class="panel" style="text-align: center;">
    <div class="dice-board" id="diceBoard"></div>
    <button class="btn-generate" id="btnRoll" type="button">ROLL (Мућкај)</button>
  </section>

</div>

<!-- SECRET MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Тајни мени — Проценти (Вероватноћа)</h2>
      <button class="modal-close" id="modalClose" type="button">✕</button>
    </div>
    <p style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 14px;">
      Унесите жељене проценте учесталости за сваки број (укупно мора бити 100%).
    </p>
    <div class="weight-grid" id="weightGrid"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="btnResetWeights" type="button" style="color: var(--accent);">Ресет</button>
      <button class="btn-secondary" id="btnSaveWeights" type="button" style="background: var(--accent); color: #1a1206; font-weight: 800;">Save & Load</button>
    </div>
  </div>
</div>

<div id="toast" role="status">Сачувано локално!</div>

<script>
(function() {
  'use strict';

  const $ = id => document.getElementById(id);
  const diceBoard = $('diceBoard');
  const btnRoll = $('btnRoll');
  const diceCountSelect = $('diceCountSelect');
  const diceThemeSelect = $('diceThemeSelect');
  const soundToggle = $('soundToggle');
  const secretTrigger = $('secretTrigger');
  const modalBackdrop = $('modalBackdrop');
  const modalClose = $('modalClose');
  const weightGrid = $('weightGrid');
  const btnResetWeights = $('btnResetWeights');
  const btnSaveWeights = $('btnSaveWeights');
  const toastEl = $('toast');

  // Default weights (16.66% each)
  let weights = [16.66, 16.66, 16.66, 16.66, 16.66, 16.70];
  let manualLocked = [false, false, false, false, false, false];

  // Load from localStorage if available
  try {
    const saved = localStorage.getItem('roll_dice_weights');
    if (saved) {
      weights = JSON.parse(saved);
    }
  } catch(e) {}

  // Dot patterns for dice faces 1-6
  const dotLayouts = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  function renderDice(values) {
    diceBoard.innerHTML = '';
    const theme = diceThemeSelect.value;
    values.forEach(val => {
      const die = document.createElement('div');
      die.className = `die ${theme}`;
      for (let i = 0; i < 9; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (dotLayouts[val].includes(i) ? ' show' : '');
        die.appendChild(dot);
      }
      diceBoard.appendChild(die);
    });
  }

  // Web Audio API shake sound generator
  function playShakeSound() {
    if (!soundToggle.checked) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }

  function getWeightedRandomNumber() {
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      if (r < weights[i]) return i + 1;
      r -= weights[i];
    }
    return 6;
  }

  function rollDice() {
    playShakeSound();
    const count = parseInt(diceCountSelect.value, 10);
    const dies = [];
    for (let i = 0; i < count; i++) {
      dies.push(Math.floor(Math.random() * 6) + 1);
    }

    // Add shaking animation class
    diceBoard.querySelectorAll('.die').forEach(d => d.classList.add('shaking'));

    setTimeout(() => {
      const finalValues = [];
      for (let i = 0; i < count; i++) {
        finalValues.push(getWeightedRandomNumber());
      }
      renderDice(finalValues);
    }, 400);
  }

  // Initial render
  renderDice([1, 6]);

  btnRoll.addEventListener('click', rollDice);

  // Shake detection via DeviceMotion
  let lastX = 0, lastY = 0, lastZ = 0;
  let lastTime = 0;
  window.addEventListener('devicemotion', (e) => {
    const current = e.accelerationIncludingGravity;
    if (!current) return;
    const now = Date.now();
    if ((now - lastTime) > 100) {
      const diffTime = now - lastTime;
      lastTime = now;
      const speed = Math.abs(current.x + current.y + current.z - lastX - lastY - lastZ) / diffTime * 10000;
      if (speed > 800) {
        rollDice();
      }
      lastX = current.x;
      lastY = current.y;
      lastZ = current.z;
    }
  });

  // Secret menu trigger (5 taps)
  let tapCount = 0;
  let tapTimer = null;
  secretTrigger.addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 800);
    if (tapCount >= 5) {
      tapCount = 0;
      openSecretModal();
    }
  });

  function openSecretModal() {
    renderWeightInputs();
    modalBackdrop.classList.add('open');
  }

  modalClose.addEventListener('click', () => modalBackdrop.classList.remove('open'));

  function renderWeightInputs() {
    weightGrid.innerHTML = '';
    weights.forEach((w, idx) => {
      const item = document.createElement('div');
      item.className = 'weight-item';
      item.innerHTML = `
        <label>Број ${idx + 1} (%)</label>
        <input type="number" step="0.01" min="0" max="100" value="${w.toFixed(2)}" data-index="${idx}">
      `;
      weightGrid.appendChild(item);
    });

    weightGrid.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.index, 10);
        let val = parseFloat(e.target.value);
        if (isNaN(val)) val = 0;
        if (val < 0) val = 0;
        if (val > 100) val = 100;

        weights[idx] = val;
        manualLocked[idx] = true;

        // Auto balance remaining weights
        balanceWeights(idx);
        renderWeightInputs();
      });
    });
  }

  function balanceWeights(changedIdx) {
    let lockedSum = 0;
    let unlockedIndices = [];

    weights.forEach((w, i) => {
      if (manualLocked[i] || i === changedIdx) {
        lockedSum += weights[i];
      } else {
        unlockedIndices.push(i);
      }
    });

    if (lockedSum > 100) {
      lockedSum = 100;
      weights[changedIdx] = 100 - (lockedSum - weights[changedIdx]);
    }

    const remaining = 100 - lockedSum;
    const currentUnlockedSum = unlockedIndices.reduce((sum, i) => sum + weights[i], 0);

    if (unlockedIndices.length > 0) {
      unlockedIndices.forEach(i => {
        if (currentUnlockedSum > 0) {
          weights[i] = (weights[i] / currentUnlockedSum) * remaining;
        } else {
          weights[i] = remaining / unlockedIndices.length;
        }
      });
    }
  }

  btnResetWeights.addEventListener('click', () => {
    weights = [16.66, 16.66, 16.66, 16.66, 16.66, 16.70];
    manualLocked = [false, false, false, false, false, false];
    renderWeightInputs();
    showToast('Ресетовано на почетак!');
  });

  btnSaveWeights.addEventListener('click', () => {
    try {
      localStorage.setItem('roll_dice_weights', JSON.stringify(weights));
      showToast('Успешно сачувано локално!');
      modalBackdrop.classList.remove('open');
    } catch(e) {}
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  diceCountSelect.addEventListener('change', () => rollDice());
  diceThemeSelect.addEventListener('change', () => renderDice([1, 6]));

})();
</script>
</body>
</html>
