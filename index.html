<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Android bridge this page needs; the app only takes silent content updates it supports (Ota.java). -->
<meta name="app-native" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roll The Dice">
<title>Roll The Dice</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-0: #0b1120; --bg-1: #131c33;
    --card: #1a2440; --card-2: #212d4d;
    --stroke: #2f3d64;
    --text: #eef2ff; --text-dim: #9aa8cc;
    --accent: #f97316; --accent-2: #fb923c;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e2a4d 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px
             calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; justify-content: center; align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

  header { text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 2px; }

  .dice-icon {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    cursor: pointer; flex-shrink: 0;
  }

  .dice-icon img { width: 100%; height: 100%; display: block; }

  h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.4px; }

  .panel-compact {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--stroke); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px 14px;
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center;
  }

  .field-inline { display: flex; flex-direction: column; gap: 3px; }
  .field-inline label { font-size: .7rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
  
  select {
    width: 100%; font-size: .85rem; font-family: inherit; color: var(--text);
    background: #0e1730; border: 1px solid var(--stroke);
    border-radius: 10px; padding: 8px 10px; outline: none;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 12px) calc(50% + 1px), calc(100% - 8px) calc(50% + 1px);
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 25px;
  }

  .checkbox-inline { display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; cursor: pointer; }
  .checkbox-inline input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

  .panel-dice {
    flex: 1; background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--stroke); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; min-height: 0;
  }

  .dice-board {
    flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 24px; width: 100%; overflow: hidden; perspective: 1200px;
  }

  .scene { width: 90px; height: 90px; perspective: 600px; }

  .cube {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.8s cubic-bezier(0.1, 0.8, 0.2, 1);
  }

  .face {
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 16px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 12px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.4);
    backface-visibility: hidden;
  }

  .cube.white .face { background: #f8fafc; border: 2px solid #cbd5e1; }
  .cube.white .dot { background: #0f172a; }

  .cube.black .face { background: #0f172a; border: 2px solid #334155; }
  .cube.black .dot { background: #f8fafc; }

  .cube.red .face { background: #dc2626; border: 2px solid #f87171; }
  .cube.red .dot { background: #fff; }

  .cube.blue .face { background: #2563eb; border: 2px solid #60a5fa; }
  .cube.blue .dot { background: #fff; }

  .cube.green .face { background: #16a34a; border: 2px solid #4ade80; }
  .cube.green .dot { background: #fff; }

  .cube.purple .face { background: #7c3aed; border: 2px solid #a78bfa; }
  .cube.purple .dot { background: #fff; }

  .cube.gold .face { background: #f59e0b; border: 2px solid #fcd34d; }
  .cube.gold .dot { background: #1c1917; }

  /* Held dice: tapped to keep their value on the next roll. */
  .scene { position: relative; cursor: pointer; }
  .scene.held::after {
    content: ''; position: absolute; inset: -7px; border-radius: 22px;
    border: 3px solid var(--accent); box-shadow: 0 0 16px rgba(249,115,22,.55);
    pointer-events: none;
  }
  .scene.held::before {
    content: 'HELD'; position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%);
    font-size: .62rem; font-weight: 800; letter-spacing: 1px; color: var(--accent);
    pointer-events: none;
  }

  .dice-total { text-align: center; margin: 6px 0 10px; transition: opacity .2s; }
  .dice-total.rolling { opacity: .35; }
  .dice-total .sum { font-size: 1.5rem; font-weight: 800; letter-spacing: -.3px; }
  .dice-total .sum b { color: var(--accent); }
  .dice-total .hint { font-size: .72rem; color: var(--text-dim); margin-top: 2px; }

  .dot {
    width: 13px; height: 13px; border-radius: 50%;
    align-self: center; justify-self: center; opacity: 0;
  }
  .dot.show { opacity: 1; }

  /* 3D Face layout */
  .face-1 { transform: rotateY(0deg) translateZ(45px); }
  .face-2 { transform: rotateY(90deg) translateZ(45px); }
  .face-3 { transform: rotateX(-90deg) translateZ(45px); }
  .face-4 { transform: rotateX(90deg) translateZ(45px); }
  .face-5 { transform: rotateY(-90deg) translateZ(45px); }
  .face-6 { transform: rotateY(180deg) translateZ(45px); }

  .btn-generate {
    width: 100%; border: none; border-radius: 14px; padding: 15px;
    font-family: inherit; font-size: 1.1rem; font-weight: 800;
    letter-spacing: .5px; color: #1a1206;
    background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
    box-shadow: 0 8px 22px rgba(249,115,22,.32); cursor: pointer;
    transition: transform .1s; flex-shrink: 0;
  }
  .btn-generate:active { transform: scale(.975); }

  .btn-sensor {
    width: 100%; border: 1px solid var(--stroke); border-radius: 12px; padding: 10px;
    font-family: inherit; font-size: 0.85rem; font-weight: 700;
    color: var(--accent); background: rgba(249,115,22,0.1); cursor: pointer; margin-top: 6px;
  }

  .update-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 8px; font-size: .75rem; color: var(--text-dim);
  }
  .btn-link {
    border: none; background: none; padding: 4px 2px; cursor: pointer;
    font-family: inherit; font-size: .75rem; font-weight: 700; color: var(--text-dim);
    text-decoration: underline; text-underline-offset: 3px;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,8,18,.85);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
    background: linear-gradient(180deg, #1c2748 0%, #151d35 100%);
    border: 1px solid var(--stroke); border-bottom: none;
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.9,.3,1);
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h2 { font-size: 1rem; font-weight: 800; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--stroke);
    background: rgba(255,255,255,.05); color: var(--text-dim); font-size: 1.1rem; cursor: pointer; display: grid; place-items: center;
  }

  .weight-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .weight-row {
    background: #0e1730; border: 1px solid var(--stroke); border-radius: 12px;
    padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .weight-row label { font-size: .85rem; font-weight: 700; color: var(--text); }
  .weight-controls { display: flex; align-items: center; gap: 6px; }
  .weight-controls input {
    width: 70px; padding: 6px; font-size: .95rem; text-align: center;
    background: #131c33; border: 1px solid var(--stroke); border-radius: 8px; color: var(--text); outline: none;
  }
  .step-btn {
    width: 32px; height: 32px; background: rgba(255,255,255,.08); border: 1px solid var(--stroke);
    border-radius: 8px; color: var(--text); font-weight: bold; font-size: 1rem; cursor: pointer; display: grid; place-items: center;
  }
  .step-btn:active { background: var(--accent); color: #1a1206; }

  .btn-secondary {
    flex: 1; border: 1px solid var(--stroke); border-radius: 12px; padding: 12px;
    font-family: inherit; font-size: .9rem; font-weight: 700;
    color: var(--text); background: rgba(255,255,255,.04); cursor: pointer;
  }
  .btn-row { display: flex; gap: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translate(-50%, calc(100% + 60px)); background: #15803d; color: #fff;
    font-size: .84rem; font-weight: 600; padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 10px 26px rgba(0,0,0,.5); transition: transform .3s; z-index: 300;
  }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="dice-icon" id="secretTrigger" title="Secret Menu">
      <img src="icons/icon-192.png" alt="">
    </div>
    <h1>Roll The Dice</h1>
  </header>

  <section class="panel-compact">
    <div class="field-inline">
      <label for="diceCountSelect">Dice</label>
      <select id="diceCountSelect">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
    <div class="field-inline">
      <label for="diceThemeSelect">Theme</label>
      <select id="diceThemeSelect">
        <option value="white">White</option>
        <option value="black">Black</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
        <option value="gold">Gold</option>
      </select>
    </div>
    <label class="checkbox-inline" style="align-self: flex-end; padding-bottom: 6px;">
      <input type="checkbox" id="soundToggle" checked> Sound
    </label>
  </section>

  <section class="panel-dice">
    <div class="dice-board" id="diceBoard"></div>
    <div class="dice-total" id="diceTotal">
      <div class="sum">Total: <b id="diceSum">0</b></div>
      <div class="hint" id="holdHint">Tap a die to hold it</div>
    </div>
    <div style="width: 100%;">
      <button class="btn-generate" id="btnRoll" type="button">ROLL</button>
      <button class="btn-sensor" id="btnEnableSensor" type="button">Enable Shake Sensor</button>
      <div class="update-row">
        <span id="appVersion"></span>
        <button class="btn-link" id="btnCheckUpdate" type="button">Check for updates</button>
      </div>
    </div>
  </section>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Secret Menu — Probabilities</h2>
      <button class="modal-close" id="modalClose" type="button">✕</button>
    </div>
    <p style="font-size: 0.78rem; color: var(--text-dim); margin-bottom: 12px;">
      Set frequencies (total strictly 100%). Use arrows for ±5% steps.
    </p>
    <div class="weight-grid" id="weightGrid"></div>
    <div class="btn-row" style="margin-top: 10px;">
      <button class="btn-secondary" id="btnResetWeights" type="button" style="color: var(--accent);">Reset</button>
      <button class="btn-secondary" id="btnSaveWeights" type="button" style="background: var(--accent); color: #1a1206; font-weight: 800;">Save & Load</button>
    </div>
  </div>
</div>

<div id="toast" role="status">Saved locally!</div>

<script>
(function() {
  'use strict';

  const $ = id => document.getElementById(id);
  const diceBoard = $('diceBoard');
  const btnRoll = $('btnRoll');
  const btnEnableSensor = $('btnEnableSensor');
  const diceCountSelect = $('diceCountSelect');
  const diceThemeSelect = $('diceThemeSelect');
  const soundToggle = $('soundToggle');
  const secretTrigger = $('secretTrigger');
  const modalBackdrop = $('modalBackdrop');
  const modalClose = $('modalClose');
  const weightGrid = $('weightGrid');
  const btnResetWeights = $('btnResetWeights');
  const btnSaveWeights = $('btnSaveWeights');
  const toastEl = $('toast');

  const DEFAULT_WEIGHTS = [16.66, 16.66, 16.66, 16.66, 16.66, 16.70];
  let weights = DEFAULT_WEIGHTS.slice();

  try {
    const saved = JSON.parse(localStorage.getItem('roll_dice_weights'));
    const valid = Array.isArray(saved) && saved.length === 6 &&
      saved.every(w => typeof w === 'number' && w >= 0) && saved.some(w => w > 0);
    if (valid) weights = saved;
  } catch(e) {}

  // Dice count, theme and sound are remembered between visits.
  try {
    const prefs = JSON.parse(localStorage.getItem('roll_dice_prefs')) || {};
    if (['1','2','3','4','5','6'].includes(prefs.count)) diceCountSelect.value = prefs.count;
    if (['white','black','red','blue','green','purple','gold'].includes(prefs.theme)) diceThemeSelect.value = prefs.theme;
    if (typeof prefs.sound === 'boolean') soundToggle.checked = prefs.sound;
  } catch(e) {}

  function savePrefs() {
    try {
      localStorage.setItem('roll_dice_prefs', JSON.stringify({
        count: diceCountSelect.value, theme: diceThemeSelect.value, sound: soundToggle.checked
      }));
    } catch(e) {}
  }

  let currentValues = [];
  let held = []; // held[i] true: die i keeps its value on the next roll

  const dotLayouts = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  const faceRotations = {
    1: { x: 0, y: 0 },
    2: { x: 0, y: -90 },
    3: { x: 90, y: 0 },
    4: { x: -90, y: 0 },
    5: { x: 0, y: 90 },
    6: { x: 0, y: 180 }
  };

  function createFaceHTML(faceNum) {
    let dotsHTML = '';
    for (let i = 0; i < 9; i++) {
      const show = dotLayouts[faceNum].includes(i) ? ' show' : '';
      dotsHTML += `<div class="dot${show}"></div>`;
    }
    return `<div class="face face-${faceNum}">${dotsHTML}</div>`;
  }

  function buildCube(theme, index) {
    const scene = document.createElement('div');
    scene.className = 'scene' + (held[index] ? ' held' : '');
    scene.dataset.index = index;
    const cube = document.createElement('div');
    cube.className = `cube ${theme}`;
    let cubeFacesHTML = '';
    for (let f = 1; f <= 6; f++) cubeFacesHTML += createFaceHTML(f);
    cube.innerHTML = cubeFacesHTML;
    scene.appendChild(cube);
    diceBoard.appendChild(scene);
    return cube;
  }

  function faceTransform(val) {
    const rot = faceRotations[val];
    return `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`;
  }

  function updateTotal() {
    $('diceSum').textContent = currentValues.reduce((a, b) => a + b, 0);
    $('holdHint').style.visibility = currentValues.length > 1 ? 'visible' : 'hidden';
    $('diceTotal').classList.remove('rolling');
  }

  // Shows dice without animation (first load, theme change).
  function renderDice(values) {
    currentValues = values;
    diceBoard.innerHTML = '';
    const theme = diceThemeSelect.value;
    values.forEach((val, i) => {
      buildCube(theme, i).style.transform = faceTransform(val);
    });
    updateTotal();
  }

  // Tap a die to hold or release it (not while the dice are spinning).
  diceBoard.addEventListener('click', (e) => {
    const scene = e.target.closest('.scene');
    if (!scene || isRollingActive) return;
    const i = parseInt(scene.dataset.index, 10);
    held[i] = !held[i];
    scene.classList.toggle('held', held[i]);
  });

  function rollDiceWithAnimation() {
    if (isRollingActive) return;
    const count = parseInt(diceCountSelect.value, 10);
    // Array.from, not held.slice: dice never tapped have no entry and must count as not held.
    const allHeld = Array.from({ length: count }, (_, i) => !!held[i]).every(Boolean);
    if (currentValues.length === count && allHeld) {
      showToast('All dice are held. Tap one to release it.');
      return;
    }
    isRollingActive = true;

    playCustomSound();

    const finalValues = [];
    for (let i = 0; i < count; i++) {
      const keep = held[i] && currentValues[i];
      finalValues.push(keep ? currentValues[i] : getWeightedRandomNumber());
    }
    currentValues = finalValues;
    $('diceTotal').classList.add('rolling');

    diceBoard.innerHTML = '';
    const theme = diceThemeSelect.value;

    finalValues.forEach((val, i) => {
      const cube = buildCube(theme, i);
      if (held[i]) { cube.style.transform = faceTransform(val); return; }

      // Start from a few full turns without transition, then spin to the rolled face.
      const startX = (Math.floor(Math.random() * 3) + 2) * 360;
      const startY = (Math.floor(Math.random() * 3) + 2) * 360;
      cube.style.transition = 'none';
      cube.style.transform = `rotateX(${startX}deg) rotateY(${startY}deg)`;
      void cube.offsetWidth; // apply the start position before animating
      cube.style.transition = 'transform 1.8s cubic-bezier(0.1, 0.8, 0.2, 1)';
      cube.style.transform = faceTransform(val);
    });

    setTimeout(() => {
      isRollingActive = false;
      updateTotal();
    }, 1850);
  }

  const diceAudio = new Audio('Kockazvuk0.mp3');
  diceAudio.preload = 'auto';

  function playCustomSound() {
    if (!soundToggle.checked) return;
    try {
      diceAudio.currentTime = 0;
      diceAudio.play().catch(e => {});
    } catch(e) {}
  }

  function getWeightedRandomNumber() {
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      if (r < weights[i]) return i + 1;
      r -= weights[i];
    }
    return 6;
  }

  let isRollingActive = false;

  renderDice([1, 6, 3, 4, 2, 5].slice(0, parseInt(diceCountSelect.value, 10)));

  // rollDiceWithAnimation plays the sound itself.
  btnRoll.addEventListener('click', rollDiceWithAnimation);

  function enableShake() {
    initShakeListener();
    btnEnableSensor.style.display = 'none';
    try { localStorage.setItem('roll_dice_shake', '1'); } catch(e) {}
  }

  const needsMotionPermission = typeof DeviceMotionEvent !== 'undefined' &&
    typeof DeviceMotionEvent.requestPermission === 'function';
  // iOS asks for permission on every visit (needs a tap); elsewhere turn it back on right away.
  try {
    if (!needsMotionPermission && localStorage.getItem('roll_dice_shake') === '1') enableShake();
  } catch(e) {}

  btnEnableSensor.addEventListener('click', () => {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(response => {
        if (response === 'granted') {
          enableShake();
          showToast('Shake sensor enabled!');
        } else {
          showToast('Permission denied');
        }
      }).catch(console.error);
    } else {
      enableShake();
      showToast('Shake sensor enabled!');
    }
  });

  function initShakeListener() {
    let lastX = null, lastY = null, lastZ = null;
    let lastMotionTime = 0;
    window.addEventListener('devicemotion', (e) => {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;
      const now = Date.now();
      if ((now - lastMotionTime) > 80) {
        if (lastX !== null) {
          const delta = Math.abs(acc.x - lastX) + Math.abs(acc.y - lastY) + Math.abs(acc.z - lastZ);
          if (delta > 10) {
            lastMotionTime = now;
            rollDiceWithAnimation();
          }
        }
        lastX = acc.x;
        lastY = acc.y;
        lastZ = acc.z;
      }
    });
  }

  let tapCount = 0;
  let tapTimer = null;
  secretTrigger.addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 800);
    if (tapCount >= 5) {
      tapCount = 0;
      openSecretModal();
    }
  });

  function openSecretModal() {
    renderWeightInputs();
    modalBackdrop.classList.add('open');
  }

  modalClose.addEventListener('click', () => modalBackdrop.classList.remove('open'));

  function renderWeightInputs() {
    weightGrid.innerHTML = '';
    weights.forEach((w, idx) => {
      const row = document.createElement('div');
      row.className = 'weight-row';
      row.innerHTML = `
        <label>Number ${idx + 1}</label>
        <div class="weight-controls">
          <button type="button" class="step-btn" data-index="${idx}" data-action="minus">-</button>
          <input type="number" step="0.1" min="0" max="100" value="${w.toFixed(1)}" data-index="${idx}">
          <button type="button" class="step-btn" data-index="${idx}" data-action="plus">+</button>
        </div>
      `;
      weightGrid.appendChild(row);
    });

    weightGrid.querySelectorAll('input').forEach(input => {
      input.addEventListener('change', (e) => {
        const idx = parseInt(e.target.dataset.index, 10);
        let val = parseFloat(e.target.value);
        if (isNaN(val)) val = 0;
        if (val < 0) val = 0; if (val > 100) val = 100;
        
        adjustWeightsStrict(idx, val);
        renderWeightInputs();
      });
    });

    weightGrid.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.dataset.index, 10);
        const action = e.target.dataset.action;
        let val = weights[idx] + (action === 'plus' ? 5 : -5);
        if (val < 0) val = 0; if (val > 100) val = 100;
        
        adjustWeightsStrict(idx, val);
        renderWeightInputs();
      });
    });
  }

  function adjustWeightsStrict(changedIdx, targetVal) {
    weights[changedIdx] = targetVal;
    
    let sumOthers = 0;
    for (let i = 0; i < 6; i++) {
      if (i !== changedIdx) sumOthers += weights[i];
    }

    const targetSumOthers = 100 - targetVal;

    if (targetSumOthers <= 0) {
      for (let i = 0; i < 6; i++) {
        if (i !== changedIdx) weights[i] = 0;
      }
    } else {
      if (sumOthers === 0) {
        const share = targetSumOthers / 5;
        for (let i = 0; i < 6; i++) {
          if (i !== changedIdx) weights[i] = share;
        }
      } else {
        for (let i = 0; i < 6; i++) {
          if (i !== changedIdx) {
            weights[i] = (weights[i] / sumOthers) * targetSumOthers;
          }
        }
      }
    }
  }

  btnResetWeights.addEventListener('click', () => {
    weights = DEFAULT_WEIGHTS.slice();
    renderWeightInputs();
    showToast('Reset!');
  });

  btnSaveWeights.addEventListener('click', () => {
    try {
      localStorage.setItem('roll_dice_weights', JSON.stringify(weights));
      showToast('Saved locally!');
      modalBackdrop.classList.remove('open');
    } catch(e) {}
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  diceCountSelect.addEventListener('change', () => { savePrefs(); held = []; rollDiceWithAnimation(); });
  diceThemeSelect.addEventListener('change', () => { savePrefs(); renderDice(currentValues); });
  soundToggle.addEventListener('change', savePrefs);

  /* ---------- updates ---------- */
  // Android app: the native side asks GitHub Releases and shows the result itself.
  // Web/PWA: compare the page the service worker cached with the one on the server.
  const android = window.DiceAndroid;
  if (android && android.getVersion) $('appVersion').textContent = 'v' + android.getVersion();

  async function checkForUpdate() {
    if (android && android.checkForUpdate) { android.checkForUpdate(); return; }
    showToast('Checking for updates…');
    try {
      // Unique URL + no-store so neither the service worker nor the HTTP cache answers.
      const res = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const fresh = await res.text();
      const cached = window.caches ? await caches.match('./index.html') : null;
      const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
      if (reg) reg.update().catch(() => {});
      if (cached && (await cached.text()) !== fresh) {
        showToast('New version found. Updating…');
        setTimeout(() => location.reload(), 900);
      } else showToast('You have the latest version');
    } catch (e) { showToast('Could not check. Are you online?'); }
  }
  $('btnCheckUpdate').addEventListener('click', checkForUpdate);

  // Offline support for the web version (the Android app bundles its files instead).
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !android) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

})();
</script>
